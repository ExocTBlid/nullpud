[project]
name = "nullpud"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ethan Blomquist", email = "etblomquist@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "adventurelib>=1.2.1",
    "rich>=15.0.0",
]

[project.scripts]
nullpud = "nullpud:main"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=6.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["src/nullpud"]
omit = ["src/nullpud/run_loop.py"]  # interactive loop; tested manually

[tool.coverage.report]
show_missing = true

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
