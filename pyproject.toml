[project]
name = "nullpud"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ethan Blomquist", email = "etblomquist@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "adventurelib>=1.2.1",
    "rich>=15.0.0",
]

[project.scripts]
nullpud = "nullpud:main"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=6.1.0",
    "python-semantic-release>=10.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["src/nullpud"]
omit = ["src/nullpud/run_loop.py"]  # interactive loop; tested manually

[tool.coverage.report]
show_missing = true

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
allow_zero_version = true
major_on_zero = false
commit_author = "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
commit_message = "chore(release): {version}\n\nAutomatically generated by python-semantic-release"
build_command = """
uv lock --upgrade-package "$PACKAGE_NAME"
git add uv.lock
"""

[tool.semantic_release.changelog]
exclude_commit_patterns = [
    '''chore(?:\([^)]*?\))?: .+''',
    '''ci(?:\([^)]*?\))?: .+''',
    '''refactor(?:\([^)]*?\))?: .+''',
    '''style(?:\([^)]*?\))?: .+''',
    '''test(?:\([^)]*?\))?: .+''',
    '''build(?:\((?!deps)[^)]*\))?: .+''',
    '''Initial [Cc]ommit.*''',
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
